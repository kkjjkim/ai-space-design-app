# 배포가 끝나면 빙·네이버·얀덱스에 새 주소를 자동으로 알린다.
#
# 왜 자동인가: 사람이 배포 후에 따로 명령어를 치는 단계를 만들면 결국 안 하게 된다.
# 배포 성공 신호를 받아 깃허브가 대신 실행한다.
#
# 언제 도는가
#  1) 버셀이 프로덕션 배포에 성공했을 때 (버셀 깃허브 연동이 켜져 있어야 신호가 온다)
#  2) Actions 탭에서 "Run workflow" 를 눌렀을 때 (수동)
#
# 안전장치: 스크립트가 배포된 사이트의 키 파일을 먼저 확인한다.
# 아직 안 올라갔으면 아무것도 보내지 않고 멈춘다.
name: IndexNow 통보

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "보내지 않고 무엇이 나갈지만 확인"
        type: boolean
        default: false

jobs:
  notify:
    # 프로덕션 배포가 성공했을 때만. 프리뷰 배포는 색인 대상이 아니다.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       contains(fromJSON('["Production","production"]'), github.event.deployment_status.environment))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 스크립트는 의존성이 없다 (lib/site.ts 를 글로 읽고 fetch 만 쓴다) — 설치 단계가 필요 없다.
      - name: 빙·네이버·얀덱스에 알리기
        run: node scripts/indexnow.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
